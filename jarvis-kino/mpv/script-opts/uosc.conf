# uosc 4.7 im Jarvis-Design: dunkel, Graustufen, ruhig (wie macOS/iOS), deutsche Beschriftung
timeline_style=bar
timeline_size_min=0
timeline_size_max=34
timeline_size_min_fullscreen=0
timeline_size_max_fullscreen=40
timeline_start_hidden=no
timeline_persistency=paused
timeline_opacity=0.95
timeline_border=0
timeline_step=10
timeline_chapters_opacity=0.8
timeline_cache=yes

controls=command:arrow_back:quit?Zurück zum Kino (Esc),gap,cycle:pause:pause:no/yes=play_arrow?Wiedergabe / Pause (Leertaste),command:replay_10:seek -10?10 s zurück (←),command:forward_10:seek 10?10 s vor (→),gap,space,<has_playlist>command:skip_previous:script-binding jarvis/vorherige?Vorherige Folge (P),<has_playlist>command:skip_next:script-binding jarvis/naechste?Nächste Folge (N),<has_playlist>command:video_library:script-binding jarvis/folgen?Folgen & Staffeln (E),gap,<has_audio>command:graphic_eq:script-binding uosc/audio#audio>1?Tonspur (A),command:subtitles:script-binding uosc/subtitles#sub>0?Untertitel (U),<has_chapter>command:bookmark:script-binding uosc/chapters?Kapitel,speed:1.2,gap,cycle:crop_free:fullscreen:no/yes=fullscreen_exit!?Vollbild (F)
controls_size=34
controls_size_fullscreen=42
controls_margin=10
controls_spacing=4
controls_persistency=paused

volume=right
volume_size=40
volume_size_fullscreen=50
volume_opacity=0.9
volume_border=0
volume_step=5
volume_persistency=

speed_opacity=0.6
speed_step=0.25
speed_step_is_factor=no
speed_persistency=

menu_item_height=40
menu_item_height_fullscreen=52
menu_min_width=320
menu_min_width_fullscreen=420
menu_opacity=0.97
menu_parent_opacity=0.4

top_bar=no-border
top_bar_size=44
top_bar_size_fullscreen=50
top_bar_controls=no
top_bar_title=yes
top_bar_title_opacity=0.9
top_bar_persistency=paused

ui_scale=1
font_scale=1
font_bold=no
text_border=1.2
text_width_estimation=yes
# Klick aufs Bild = Pause, Doppelklick = Vollbild
click_threshold=250
click_command=cycle pause; script-binding uosc/flash-pause-indicator
flash_duration=1000
proximity_in=40
proximity_out=120

# Jarvis-Graustufen (wie das Kino): helles Grau als Akzent, dunkles Grau als Fläche
foreground=e5e5ea
foreground_text=0a0a0b
background=1c1c1e
background_text=f5f5f7
curtain_opacity=0.55

destination_time=playtime-remaining
time_precision=0
buffered_time_threshold=60
autohide=no
pause_indicator=flash
autoload=no
shuffle=no
adjust_osd_margins=yes

chapter_ranges=openings:ebebf540,endings:ebebf540,intros:ebebf540,outros:ebebf540,ads:8e8e9360
chapter_range_patterns=intros:[Ii]ntro,[Vv]orspann,[Tt]itelsequenz;outros:[Aa]bspann,[Oo]utro,[Cc]redits
