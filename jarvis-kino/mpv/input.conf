# Jarvis Kino – Tastenbelegung (wie bei den großen Streaming-Apps)
SPACE        cycle pause; script-binding uosc/flash-pause-indicator
k            cycle pause; script-binding uosc/flash-pause-indicator
PLAYPAUSE    cycle pause
PLAY         set pause no
PAUSE        set pause yes
LEFT         seek -10; script-binding uosc/flash-timeline
RIGHT        seek  10; script-binding uosc/flash-timeline
j            seek -10; script-binding uosc/flash-timeline
l            seek  10; script-binding uosc/flash-timeline
Shift+LEFT   seek -60; script-binding uosc/flash-timeline
Shift+RIGHT  seek  60; script-binding uosc/flash-timeline
Ctrl+LEFT    add chapter -1
Ctrl+RIGHT   add chapter 1
REWIND       seek -10
FORWARD      seek  10
HOME         seek 0 absolute; script-binding uosc/flash-timeline
END          seek 100 absolute-percent+exact
UP           add volume 5; script-binding uosc/flash-volume
DOWN         add volume -5; script-binding uosc/flash-volume
WHEEL_UP     add volume 2; script-binding uosc/flash-volume
WHEEL_DOWN   add volume -2; script-binding uosc/flash-volume
VOLUME_UP    add volume 5; script-binding uosc/flash-volume
VOLUME_DOWN  add volume -5; script-binding uosc/flash-volume
m            cycle mute; script-binding uosc/flash-volume
MUTE         cycle mute
f            cycle fullscreen
F11          cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
ESC          quit
BS           quit
q            quit
CLOSE_WIN    quit
STOP         quit
MBTN_BACK    quit

# Folgen, nächste Folge, Intro (jarvis.lua)
e            script-binding jarvis/folgen
TAB          script-binding jarvis/folgen
n            script-binding jarvis/naechste
NEXT         script-binding jarvis/naechste
PREV         script-binding jarvis/vorherige
p            script-binding jarvis/vorherige
s            script-binding jarvis/intro
ENTER        script-binding jarvis/aktion
KP_ENTER     script-binding jarvis/aktion

# Ton, Untertitel, Tempo
a            script-binding uosc/audio
u            script-binding uosc/subtitles
c            script-binding uosc/subtitles
v            cycle sub-visibility
z            add sub-delay -0.1
x            add sub-delay +0.1
Shift+z      add audio-delay -0.1
Shift+x      add audio-delay +0.1
[            add speed -0.25; script-binding uosc/flash-speed
]            add speed 0.25; script-binding uosc/flash-speed
Ctrl+0       set speed 1; script-binding uosc/flash-speed
.            frame-step
,            frame-back-step
MENU         script-binding uosc/menu
MBTN_RIGHT   script-binding uosc/menu
i            script-binding stats/display-stats-toggle
h            script-binding stats/display-page-1-toggle
Ctrl+s       screenshot video
