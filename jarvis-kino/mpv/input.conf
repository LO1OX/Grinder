# Jarvis Kino – Tastenbelegung (wie bei den großen Streaming-Apps)
# „#! Titel“ baut das Rechtsklick-Menü (deutsch, nur das Nötige).
# „no-osd“: keine englischen mpv-Einblendungen – die Leiste zeigt Lautstärke/Tempo selbst.

SPACE        cycle pause
k            cycle pause
PLAYPAUSE    cycle pause
PLAY         set pause no
PAUSE        set pause yes
MBTN_LEFT_DBL cycle fullscreen
LEFT         no-osd seek -10; script-binding uosc/flash-timeline
RIGHT        no-osd seek  10; script-binding uosc/flash-timeline
j            no-osd seek -10; script-binding uosc/flash-timeline
l            no-osd seek  10; script-binding uosc/flash-timeline
Shift+LEFT   no-osd seek -60; script-binding uosc/flash-timeline
Shift+RIGHT  no-osd seek  60; script-binding uosc/flash-timeline
Ctrl+LEFT    no-osd add chapter -1
Ctrl+RIGHT   no-osd add chapter 1
REWIND       no-osd seek -10
FORWARD      no-osd seek  10
HOME         no-osd seek 0 absolute; script-binding uosc/flash-timeline  #! Von vorn
END          no-osd seek 100 absolute-percent+exact
UP           no-osd add volume 5; script-binding uosc/flash-volume
DOWN         no-osd add volume -5; script-binding uosc/flash-volume
WHEEL_UP     no-osd add volume 2; script-binding uosc/flash-volume
WHEEL_DOWN   no-osd add volume -2; script-binding uosc/flash-volume
VOLUME_UP    no-osd add volume 5; script-binding uosc/flash-volume
VOLUME_DOWN  no-osd add volume -5; script-binding uosc/flash-volume
m            no-osd cycle mute; script-binding uosc/flash-volume
MUTE         no-osd cycle mute

# Folgen, Ton, Untertitel (jarvis.lua) – auch im Rechtsklick-Menü
e            script-binding jarvis/folgen       #! Folgen & Staffeln
TAB          script-binding jarvis/folgen
n            script-binding jarvis/naechste     #! Nächste Folge
NEXT         script-binding jarvis/naechste
p            script-binding jarvis/vorherige    #! Vorherige Folge
PREV         script-binding jarvis/vorherige
a            script-binding jarvis/ton          #! Tonspur
u            script-binding jarvis/untertitel   #! Untertitel
c            script-binding jarvis/untertitel
s            script-binding jarvis/intro
ENTER        script-binding jarvis/aktion
KP_ENTER     script-binding jarvis/aktion
f            cycle fullscreen                   #! Vollbild
F11          cycle fullscreen
ESC          quit                               #! Zurück zum Kino
BS           quit
q            quit
CLOSE_WIN    quit
STOP         quit
MBTN_BACK    quit
MENU         script-binding uosc/menu
MBTN_RIGHT   script-binding uosc/menu

# Feinheiten
v            no-osd cycle sub-visibility
z            no-osd add sub-delay -0.1
x            no-osd add sub-delay +0.1
Shift+z      no-osd add audio-delay -0.1
Shift+x      no-osd add audio-delay +0.1
[            no-osd add speed -0.25; script-binding uosc/flash-speed
]            no-osd add speed 0.25; script-binding uosc/flash-speed
Ctrl+0       no-osd set speed 1; script-binding uosc/flash-speed
.            frame-step
,            frame-back-step
Ctrl+s       screenshot video
Ctrl+Alt+i   script-binding stats/display-stats-toggle
