# Jarvis Kino – eigene mpv-Einstellungen (unabhängig vom System-mpv)

# ---- Bild & Hardware-Beschleunigung ----
# auto-safe nimmt automatisch VAAPI (Intel/AMD) oder NVDEC (NVIDIA) und fällt
# sicher auf den Prozessor zurück. Überschreibbar in den App-Einstellungen.
# vo: automatisch (GPU-Ausgabe, sonst Ausweichlösung)
hwdec=auto-safe
hwdec-codecs=all
video-sync=audio
interpolation=no
deband=no
scale=spline36
cscale=spline36
dscale=mitchell
tone-mapping=auto

# ---- Netzwerk: stabil auch über Cloudflare/Mobilfunk ----
cache=yes
cache-secs=600
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=256MiB
demuxer-readahead-secs=600
cache-pause=yes
cache-pause-wait=3
cache-pause-initial=no
network-timeout=45
stream-lavf-o-append=reconnect=1
stream-lavf-o-append=reconnect_streamed=1
stream-lavf-o-append=reconnect_on_network_error=1
stream-lavf-o-append=reconnect_on_http_error=5xx
stream-lavf-o-append=reconnect_delay_max=20
stream-lavf-o-append=multiple_requests=1
# Lange Filme: Spulen ohne Neuladen der ganzen Datei
force-seekable=yes
hr-seek=yes

# ---- Ton ----
volume=100
volume-max=150
audio-channels=auto-safe
audio-normalize-downmix=yes
audio-file-auto=no

# ---- Untertitel: gut lesbar, weiß mit dunklem Rand ----
sub-auto=fuzzy
sub-font="Ubuntu"
sub-bold=yes
sub-font-size=46
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2.6
sub-shadow-offset=1.2
sub-shadow-color="#80000000"
sub-margin-y=48
sub-use-margins=yes
sub-ass-override=scale
sub-fix-timing=yes

# ---- Fenster & Oberfläche (uosc ersetzt die Standard-Leiste) ----
osc=no
osd-bar=no
# Fenstermodus mit normalem Systemrahmen (Vollbild ist ohnehin randlos)
border=yes
autofit-larger=85%x85%
title=${?media-title:${media-title}}${!media-title:Jarvis Kino}
force-window=immediate
keepaspect-window=yes
cursor-autohide=1500
stop-screensaver=yes
osd-font="Ubuntu"
osd-font-size=26
osd-duration=1500
osd-border-size=1.5
osd-shadow-offset=1
osd-margin-x=40
osd-margin-y=36
osd-align-x=left
osd-align-y=top
# Bilderordner gibt die App vor (XDG, z. B. ~/Bilder)
screenshot-template="Jarvis-%F-%P"
save-position-on-quit=no
resume-playback=no
input-default-bindings=yes
# nur die eigene Belegung (input.conf), keine mpv-Standardtasten mit englischen Meldungen
input-builtin-bindings=no
ytdl=no
